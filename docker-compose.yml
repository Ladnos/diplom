# ════════════════════════════════════════════════════════════════════════════
#  CRM — учёт работы сотрудников. Полный стенд одной командой.
#
#      cp .env.example .env     # поменяйте секреты
#      docker compose up -d
#      open http://localhost:8080
#
#  Архитектура: docs/architecture.md
#  Профили:
#      --profile media   coturn (STUN/TURN для видеозвонков через NAT)
#      --profile dev     mailhog (перехват исходящей почты)
# ════════════════════════════════════════════════════════════════════════════

name: crm

# ── Общие фрагменты ─────────────────────────────────────────────────────────

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TZ: ${TZ:-Europe/Moscow}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-crm}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?переменная RABBITMQ_PASSWORD обязательна}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?переменная REDIS_PASSWORD обязательна}
  AUTH_SERVICE_URL: auth-service:50051
  HR_SERVICE_URL: hr-service:50052
  APPROVAL_SERVICE_URL: approval-service:50053
  TASK_SERVICE_URL: task-service:50054
  CHAT_SERVICE_URL: chat-service:50055
  VIDEO_SERVICE_URL: video-service:50056
  FILE_SERVICE_URL: file-service:50057
  NOTIFICATION_SERVICE_URL: notification-service:50058
  ANALYTICS_SERVICE_URL: analytics-service:50059

x-service-base: &service-base
  restart: unless-stopped
  networks: [crm-internal, crm-data]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  # Ограничения по памяти: на одном сервере десять контейнеров Node без
  # лимитов способны выдавить друг друга и уронить постгрес.
  deploy:
    resources:
      limits:
        memory: 512M

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ════════════════════════════════════════════════════════════════════════════

services:

  # ── Краевой слой ──────────────────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Только чтение: писать в хранилище имеет право лишь file-service.
      # Nginx нужен доступ к тому для X-Accel-Redirect и secure_link (§9.3).
      - files:/data/files:ro
    networks: [crm-public, crm-internal]
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    <<: *logging

  api-gateway:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: crm-api-gateway
    networks: [crm-public, crm-internal, crm-data]
    environment:
      <<: *common-env
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?переменная JWT_ACCESS_SECRET обязательна}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}

  # ── Доменные сервисы ──────────────────────────────────────────────────────

  auth-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: crm-auth
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://auth_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/auth_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?переменная JWT_ACCESS_SECRET обязательна}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?переменная JWT_REFRESH_SECRET обязательна}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}

  hr-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/hr-service/Dockerfile
    container_name: crm-hr
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://hr_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/hr_db?schema=public

  approval-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/approval-service/Dockerfile
    container_name: crm-approval
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://approval_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/approval_db?schema=public

  task-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/task-service/Dockerfile
    container_name: crm-task
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://task_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/task_db?schema=public

  chat-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/chat-service/Dockerfile
    container_name: crm-chat
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://chat_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/chat_db?schema=public
    deploy:
      resources:
        limits:
          # Самый нагруженный по записи сервис (ADR-5)
          memory: 768M

  video-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/video-service/Dockerfile
    container_name: crm-video
    networks: [crm-internal, crm-data, crm-media]
    # Медиапорты публикуются на хост: клиент устанавливает DTLS-SRTP
    # соединение с SFU напрямую, минуя nginx и Node (§8.3).
    ports:
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-40100}:40000-40100/udp"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://video_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/video_db?schema=public
      # Публичный адрес сервера: внутренний IP Docker-сети клиенту
      # недоступен, ICE-кандидат с ним никогда не подключится.
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-40100}
      TURN_HOST: ${TURN_HOST:-127.0.0.1}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_USER: ${TURN_USER:-crm}
      TURN_PASSWORD: ${TURN_PASSWORD:-crm}

  file-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    container_name: crm-file
    volumes:
      # Единственный сервис с правом записи в хранилище. Он же —
      # единственный, привязанный к конкретному узлу (§9.6).
      - files:/data/files
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://file_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/file_db?schema=public
      FILE_STORAGE_PATH: /data/files
      FILE_MAX_UPLOAD_BYTES: ${FILE_MAX_UPLOAD_BYTES:-52428800}
      FILE_SIGNED_LINK_SECRET: ${FILE_SIGNED_LINK_SECRET:?переменная FILE_SIGNED_LINK_SECRET обязательна}
      FILE_SIGNED_LINK_TTL: ${FILE_SIGNED_LINK_TTL:-86400}
      FILE_QUOTA_PER_USER_BYTES: ${FILE_QUOTA_PER_USER_BYTES:-5368709120}
      FILE_DISK_ALERT_THRESHOLD: ${FILE_DISK_ALERT_THRESHOLD:-0.85}

  notification-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: crm-notification
    # Единственный доменный сервис с выходом наружу: ему нужно достучаться
    # до внешнего SMTP и push-шлюза. Остальные сидят в internal-сетях без
    # доступа в интернет — скомпрометированный сервис не сможет ничего
    # выгрузить наружу.
    networks: [crm-internal, crm-data, crm-public]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://notification_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/notification_db?schema=public
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CRM <noreply@example.local>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.local}

  analytics-service:
    <<: [*service-base, *logging]
    build:
      context: .
      dockerfile: apps/analytics-service/Dockerfile
    container_name: crm-analytics
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://analytics_svc:${POSTGRES_SERVICE_PASSWORD}@postgres:5432/analytics_db?schema=public

  # attendance-service ЗАРЕЗЕРВИРОВАН и намеренно не разворачивается.
  # Фактический учёт прихода/ухода не ведётся: при окладе он не влияет
  # ни на одно решение (docs/architecture.md ADR-2, §3.4).
  # Порт 50060, база attendance_db и очередь attendance.events свободны.

  # ── Инфраструктура ────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?переменная POSTGRES_SUPERUSER_PASSWORD обязательна}
      POSTGRES_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:?переменная POSTGRES_SERVICE_PASSWORD обязательна}
      POSTGRES_DB: postgres
      # Ускоряет первый старт; на данные не влияет
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипт выполняется только при пустом томе — создаёт 9 баз и ролей
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [crm-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-crm} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *logging

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?переменная REDIS_PASSWORD обязательна}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks: [crm-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *logging

  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    container_name: crm-rabbitmq
    restart: unless-stopped
    hostname: crm-rabbitmq   # имя узла влияет на путь к данным Mnesia
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?переменная RABBITMQ_PASSWORD обязательна}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    # Management UI наружу НЕ публикуется: сеть crm-data объявлена
    # internal, и порты контейнера в ней всё равно не пробрасываются —
    # Docker игнорирует publish для внутренних сетей. Доступ к UI даёт
    # docker-compose.dev.yml либо туннель:
    #   ssh -L 15672:localhost:15672  +  docker compose exec rabbitmq ...
    networks: [crm-data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    <<: *logging

  # ── Опциональные компоненты ───────────────────────────────────────────────

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: crm-coturn
    restart: unless-stopped
    profiles: [media]
    # host-сеть обязательна: TURN раздаёт клиентам собственный адрес,
    # и за NAT Docker-моста ICE-кандидаты оказываются нерабочими.
    network_mode: host
    command: >
      --listening-port=${TURN_PORT:-3478}
      --realm=${TURN_REALM:-crm.local}
      --user=${TURN_USER:-crm}:${TURN_PASSWORD:-crm}
      --lt-cred-mech
      --fingerprint
      --no-cli
      --no-tlsv1
      --no-tlsv1_1
    <<: *logging

  mailhog:
    image: mailhog/mailhog:latest
    container_name: crm-mailhog
    restart: unless-stopped
    profiles: [dev]
    # Перехватывает всю исходящую почту: письма видны на localhost:8025
    # и никуда не уходят. Для разработки безопаснее реального SMTP.
    ports:
      - "127.0.0.1:8025:8025"
    networks: [crm-data]
    <<: *logging

# ════════════════════════════════════════════════════════════════════════════

networks:
  # Единственная сеть с выходом наружу
  crm-public:
    driver: bridge
  # Межсервисный gRPC. internal: true — контейнеры не имеют доступа в интернет
  crm-internal:
    driver: bridge
    internal: true
  # Базы, кэш, брокер. Тоже изолирована от внешнего мира
  crm-data:
    driver: bridge
    internal: true
  # WebRTC-медиа
  crm-media:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  # Локальное файловое хранилище (ADR-4). Резервная копия:
  #   docker run --rm -v crm_files:/data -v $PWD:/backup alpine \
  #     tar czf /backup/files.tar.gz -C /data .
  files:
