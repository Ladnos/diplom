# Конфигурация RabbitMQ для self-hosted развёртывания.

# Слушать на всех интерфейсах внутри Docker-сети
listeners.tcp.default = 5672
management.tcp.port = 15672

# Порог памяти: при превышении брокер притормаживает издателей вместо
# того, чтобы быть убитым OOM-killer'ом. На небольшом сервере это разница
# между деградацией и потерей всех неподтверждённых сообщений.
vm_memory_high_watermark.relative = 0.6

# Остановить приём при нехватке диска: очереди durable, и запись на
# заполненный диск повредила бы их.
disk_free_limit.absolute = 1GB

# Логи в stdout — их забирает docker logs, отдельный файл не нужен
log.console = true
log.console.level = info
log.file = false

# Максимальный размер сообщения. Файлы через брокер не ходят (они идут
# в file-service напрямую), поэтому 4 МБ с запасом хватает на конверт
# события с большим payload.
max_message_size = 4194304

# Таймаут подтверждения потребителем: обработчик, зависший дольше
# 30 минут, считается мёртвым и сообщение возвращается в очередь.
consumer_timeout = 1800000
