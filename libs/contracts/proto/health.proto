syntax = "proto3";

package grpc.health.v1;

// Стандартный gRPC Health Checking Protocol.
// Реализуется каждым сервисом через @crm/common → HealthModule.
// Используется межсервисными клиентами для проверки доступности адресата
// (docs/architecture.md §6.4).

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}
