syntax = "proto3";

package auth;

import "common.proto";

// auth-service :50051
// Аутентификация, JWT, RBAC и scope-проверки «руководитель ↔ подчинённый».
// docs/architecture.md §6.2

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResult);
  rpc Login(LoginRequest) returns (TokenPair);
  rpc RefreshToken(RefreshRequest) returns (TokenPair);
  rpc ValidateToken(ValidateTokenRequest) returns (TokenClaims);
  rpc CheckPermission(CheckPermissionRequest) returns (PermissionResult);
  rpc CheckPermissionsBatch(BatchPermissionRequest) returns (BatchPermissionResult);
  rpc RevokeSession(RevokeRequest) returns (common.Empty);
  rpc RevokeAllSessions(RevokeAllRequest) returns (common.Empty);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  // ФИО не хранится в auth_db: оно едет в событии auth.user.registered,
  // чтобы hr-service мог сразу создать заготовку профиля. Мастер-данные
  // о персонале принадлежат hr-service, а не сервису аутентификации.
  string full_name = 3;
}

message RegisterResult {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string user_agent = 3;
  string ip = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  int64 refresh_expires_at = 4;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message TokenClaims {
  string user_id = 1;
  string employee_id = 2;
  repeated string roles = 3;
  // Есть хотя бы один подчинённый. Вычисляется из денормализованного дерева
  // подчинения, которое auth поддерживает по событию hr.hierarchy.changed.
  bool is_manager = 4;
  int64 expires_at = 5;
}

// Область действия права. Именно owner_id превращает роль «руководитель»
// в проверку «руководитель ЭТОГО сотрудника» (ADR-3, часть 2).
message CheckPermissionRequest {
  string user_id = 1;
  string resource = 2;    // "board" | "shift" | "vacation_request" | "channel" | "file"
  string action = 3;      // "read" | "write" | "approve" | "delete"
  string resource_id = 4;
  string owner_id = 5;    // чей это ресурс (employee_id владельца)
}

message PermissionResult {
  bool allowed = 1;
  string reason = 2;
  Scope scope = 3;

  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SELF = 1;
    SUBORDINATE = 2;
    DEPARTMENT = 3;
    GLOBAL = 4;
  }
}

message BatchPermissionRequest {
  repeated CheckPermissionRequest requests = 1;
}

message BatchPermissionResult {
  repeated PermissionResult results = 1;
}

message RevokeRequest {
  string session_id = 1;
}

message RevokeAllRequest {
  string user_id = 1;
  string reason = 2;
}

// ────────────────────────────────────────────────────────────────────────────
//  Администрирование учётных записей и ролей
//
//  Отдельный gRPC-сервис в том же пакете: у него принципиально иная
//  аудитория (администратор, а не каждый запрос пользователя) и иные
//  требования — полный аудит каждой операции и защита от потери доступа
//  к системе. Смешивать его с горячим путём аутентификации не стоит.
// ────────────────────────────────────────────────────────────────────────────

service AdminService {
  rpc ListUsers(ListUsersRequest) returns (UserPage);
  rpc GetUser(UserId) returns (UserDetails);
  rpc GrantRole(RoleAssignment) returns (UserDetails);
  rpc RevokeRole(RoleAssignment) returns (UserDetails);
  rpc BlockUser(BlockRequest) returns (UserDetails);
  rpc UnblockUser(ActorRequest) returns (UserDetails);
  rpc ListSessions(UserId) returns (SessionList);
  rpc RevokeUserSessions(BlockRequest) returns (common.Counter);
  rpc ListRoles(common.Empty) returns (RoleList);
}

message UserId {
  string user_id = 1;
}

message ActorRequest {
  string user_id = 1;
  string actor_user_id = 2;
}

message ListUsersRequest {
  // Поиск по email; пусто — все
  string query = 1;
  string role_code = 2;
  string status = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message UserSummary {
  string user_id = 1;
  string email = 2;
  string status = 3;
  string employee_id = 4;
  repeated string roles = 5;
  int64 created_at = 6;
  int32 active_sessions = 7;
}

message UserPage {
  repeated UserSummary users = 1;
  int32 total = 2;
}

message RoleGrant {
  string role_code = 1;
  string role_name = 2;
  // Роль выдана системой, а не человеком: MANAGER выводится из
  // оргструктуры и снимается, когда подчинённых не остаётся.
  bool auto = 3;
  string assigned_by = 4;
  int64 assigned_at = 5;
}

message UserDetails {
  UserSummary summary = 1;
  repeated RoleGrant grants = 2;
}

message RoleAssignment {
  string user_id = 1;
  string role_code = 2;
  // Кто выполняет операцию — нужен и для аудита, и для проверок,
  // защищающих от самоблокировки.
  string actor_user_id = 3;
}

message BlockRequest {
  string user_id = 1;
  string reason = 2;
  string actor_user_id = 3;
}

message SessionInfo {
  string session_id = 1;
  string user_agent = 2;
  string ip = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
}

message SessionList {
  repeated SessionInfo sessions = 1;
}

message PermissionInfo {
  string resource = 1;
  string action = 2;
  string scope = 3;
}

message RoleInfo {
  string code = 1;
  string name = 2;
  repeated PermissionInfo permissions = 3;
  int32 user_count = 4;
}

message RoleList {
  repeated RoleInfo roles = 1;
}
