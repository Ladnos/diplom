syntax = "proto3";

package task;

import "common.proto";

// task-service :50054 — Kanban

service TaskService {
  // Доски
  rpc CreateBoard(CreateBoardCmd) returns (Board);
  rpc ListBoards(MemberRequest) returns (BoardList);
  rpc GetBoard(BoardRequest) returns (BoardView);
  rpc GetBoardMembers(BoardRequest) returns (MemberList);
  rpc AddMembers(MembersCmd) returns (MemberList);
  rpc RemoveMember(MemberCmd) returns (common.Empty);

  // Колонки
  rpc CreateColumn(CreateColumnCmd) returns (Column);
  rpc UpdateColumn(UpdateColumnCmd) returns (Column);
  rpc DeleteColumn(ColumnRequest) returns (common.Counter);
  rpc ReorderColumns(ReorderColumnsCmd) returns (ColumnList);

  // Карточки
  rpc GetCard(CardRequest) returns (Card);
  rpc CreateCard(CreateCardCmd) returns (Card);
  rpc UpdateCard(UpdateCardCmd) returns (Card);
  rpc MoveCard(MoveCardCmd) returns (Card);
  rpc AssignCard(AssignCardCmd) returns (Card);
  rpc DeleteCard(CardRequest) returns (common.Empty);
  rpc GetCardsByAssignee(AssigneeRequest) returns (CardList);
  rpc GetTeamWorkload(TeamRequest) returns (WorkloadReport);
  // Основа акта выполненных работ для политики DELIVERABLE_BASED (§3.2)
  rpc GetClosedInPeriod(ClosedInPeriodRequest) returns (CardList);

  // Комментарии и метки
  rpc AddComment(AddCommentCmd) returns (Comment);
  rpc ListComments(CardRequest) returns (CommentList);
  rpc CreateLabel(CreateLabelCmd) returns (Label);
  rpc DeleteLabel(LabelRequest) returns (common.Empty);
}

// ────────────────────────────────────────────────────────────────────────────
//  Доска
// ────────────────────────────────────────────────────────────────────────────

enum BoardRole {
  BOARD_ROLE_UNSPECIFIED = 0;
  OWNER = 1;
  MEMBER = 2;
  VIEWER = 3;
}

message Board {
  string board_id = 1;
  string name = 2;
  string department_id = 3;
  string created_by_employee_id = 4;
  bool archived = 5;
  repeated Column columns = 6;
  repeated BoardMember members = 7;
  repeated Label labels = 8;
  int64 created_at = 9;
}

message BoardList {
  repeated Board boards = 1;
}

/// Доска вместе с карточками — то, что отрисовывает интерфейс за один запрос.
message BoardView {
  Board board = 1;
  repeated Card cards = 2;
  // Доступность исполнителей: кто в отпуске и до какого числа
  repeated Availability availability = 3;
}

message Availability {
  string employee_id = 1;
  bool active = 2;
  string absent_until = 3;
  string absence_type = 4;
}

message BoardMember {
  string employee_id = 1;
  BoardRole role = 2;
  int64 added_at = 3;
}

message MemberList {
  repeated BoardMember members = 1;
}

message Column {
  string column_id = 1;
  string board_id = 2;
  string name = 3;
  double position = 4;
  // Предел незавершённой работы. 0 — без ограничения.
  int32 wip_limit = 5;
  bool is_done_column = 6;
  // Сколько карточек сейчас в колонке — чтобы интерфейс показал заполнение
  int32 card_count = 7;
}

message ColumnList {
  repeated Column columns = 1;
}

message Label {
  string label_id = 1;
  string board_id = 2;
  string name = 3;
  string color = 4;
}

// ────────────────────────────────────────────────────────────────────────────
//  Карточка
// ────────────────────────────────────────────────────────────────────────────

message Card {
  string card_id = 1;
  string board_id = 2;
  string column_id = 3;
  string title = 4;
  string description = 5;
  string author_employee_id = 6;
  string assignee_employee_id = 7;
  // Дробная позиция: вставка между соседями не трогает остальные карточки
  double position = 8;
  repeated Label labels = 9;
  repeated string attachment_file_ids = 10;
  string due_date = 11;
  int32 estimate_minutes = 12;
  // Оптимистическая версия: защищает от одновременного перетаскивания
  int64 version = 13;
  int64 created_at = 14;
  int64 closed_at = 15;
}

message CardList {
  repeated Card cards = 1;
  common.PageInfo page = 2;
}

message Comment {
  string comment_id = 1;
  string card_id = 2;
  string author_employee_id = 3;
  string body = 4;
  repeated string mentions = 5;
  int64 created_at = 6;
}

message CommentList {
  repeated Comment comments = 1;
}

// ────────────────────────────────────────────────────────────────────────────
//  Команды и запросы
// ────────────────────────────────────────────────────────────────────────────

message BoardRequest {
  string board_id = 1;
  // Кто запрашивает. Доступ к доске определяется УЧАСТИЕМ в ней, а не
  // только ролью: без этого поля любой аутентифицированный пользователь
  // прочитал бы чужую доску, зная её идентификатор.
  string actor_employee_id = 2;
}

message CardRequest {
  string card_id = 1;
  string actor_employee_id = 2;
}

message ColumnRequest {
  string column_id = 1;
}

message LabelRequest {
  string label_id = 1;
}

message MemberRequest {
  string employee_id = 1;
}

message CreateBoardCmd {
  string name = 1;
  string department_id = 2;
  string created_by_employee_id = 3;
  repeated string member_employee_ids = 4;
}

message MembersCmd {
  string board_id = 1;
  repeated string employee_ids = 2;
  BoardRole role = 3;
}

message MemberCmd {
  string board_id = 1;
  string employee_id = 2;
}

message CreateColumnCmd {
  string board_id = 1;
  string name = 2;
  int32 wip_limit = 3;
  bool is_done_column = 4;
  string after_column_id = 5;
}

message UpdateColumnCmd {
  string column_id = 1;
  string name = 2;
  int32 wip_limit = 3;
  bool is_done_column = 4;
  // proto3 не отличает «не задано» от false, поэтому изменяемые поля
  // перечисляются явно — иначе любой вызов сбрасывал бы is_done_column
  repeated string update_mask = 5;
}

message ReorderColumnsCmd {
  string board_id = 1;
  repeated string ordered_column_ids = 2;
}

message CreateCardCmd {
  string board_id = 1;
  string column_id = 2;
  string title = 3;
  string description = 4;
  string author_employee_id = 5;
  string assignee_employee_id = 6;
  string due_date = 7;
  int32 estimate_minutes = 8;
}

message UpdateCardCmd {
  string card_id = 1;
  string title = 2;
  string description = 3;
  string due_date = 4;
  int32 estimate_minutes = 5;
  repeated string label_ids = 6;
  repeated string update_mask = 7;
}

message MoveCardCmd {
  string card_id = 1;
  string to_column_id = 2;
  // Позиция в целевой колонке, считая с нуля
  int32 target_index = 3;
  string actor_employee_id = 4;
  // Версия, которую видел клиент. Несовпадение — кто-то опередил.
  int64 expected_version = 5;
}

message AssignCardCmd {
  string card_id = 1;
  // Пусто — снять исполнителя
  string assignee_employee_id = 2;
  string actor_employee_id = 3;
}

message AddCommentCmd {
  string card_id = 1;
  string author_employee_id = 2;
  string body = 3;
  repeated string mentions = 4;
}

message CreateLabelCmd {
  string board_id = 1;
  string name = 2;
  string color = 3;
}

message AssigneeRequest {
  string assignee_employee_id = 1;
  bool only_open = 2;
  int32 limit = 3;
}

message TeamRequest {
  repeated string employee_ids = 1;
}

message ClosedInPeriodRequest {
  repeated string employee_ids = 1;
  common.DatePeriod period = 2;
}

message WorkloadReport {
  repeated EmployeeWorkload items = 1;
}

message EmployeeWorkload {
  string employee_id = 1;
  int32 open_cards = 2;
  int32 overdue_cards = 3;
  int32 estimate_minutes = 4;
}
